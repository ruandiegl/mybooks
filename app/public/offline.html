<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#B90041" />
    <title>Sem conexão · TrocaLivros</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fff8f7; color: #271719; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      h1 { margin: 0 0 12px; color: #b90041; font-size: 1.5rem; }
      p { line-height: 1.55; }
      button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 20px; background: #b90041; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Quando a internet voltar, tente abrir o TrocaLivros novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
