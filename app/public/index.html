<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="application-name" content="TrocaLivros" />
    <meta name="theme-color" content="#B90041" />
    <meta name="description" content="Descubra livros, encontre leitores e troque histórias." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TrocaLivros" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>%WEB_TITLE%</title>
    <script id="pwa-install-bootstrap">
      (() => {
        if (window.__trocalivrosPwaInstallBridge) return;
        const bridge = { pending: null, installed: false };
        window.__trocalivrosPwaInstallBridge = bridge;
        const notify = () => window.dispatchEvent(new Event('trocalivros:pwa-install-change'));
        window.addEventListener('beforeinstallprompt', event => {
          event.preventDefault(); bridge.pending = event; notify();
        });
        window.addEventListener('appinstalled', () => {
          bridge.pending = null; bridge.installed = true; notify();
        });
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background-color: #FFF8F7;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      /* Follow the visible viewport as Safari's toolbars expand/collapse.
         Insets belong to SafeAreaView/tab bar, not a second padding on body. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
    </style>
    <style id="tl-boot-style">
      #tl-boot[hidden], #tl-boot-reload[hidden] { display: none; }
      #tl-boot { position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box; display: grid; place-items: center; overflow: auto; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: var(--tl-boot-bg, #FFF8F7); color: var(--tl-boot-fg, #271719); font-family: system-ui, sans-serif; text-align: center; }
      .tl-boot-inner { width: 100%; max-width: 360px; margin: auto; }
      #tl-boot img { width: 96px; height: 96px; object-fit: contain; }
      .tl-boot-brand { font-size: 24px; font-weight: 700; margin: 24px 0 12px; overflow-wrap: anywhere; }
      #tl-boot-status { font-size: 16px; line-height: 1.5; margin: 0; }
      #tl-boot-reload { margin-top: 24px; min-height: 48px; max-width: 100%; padding: 12px 24px; border: 0; border-radius: 16px; font: inherit; font-weight: 600; background: var(--tl-boot-primary, #B90041); color: var(--tl-boot-on-primary, #FFFFFF); cursor: pointer; }
      #tl-boot-reload:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    </style>
    <script>
      (() => {
        let preference = 'system';
        try {
          const value = JSON.parse(localStorage.getItem('trocalivros.appearance.v1'));
          if (value && value.version === 1 && ['light', 'dark', 'system'].includes(value.theme)) preference = value.theme;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const color = dark ? '#181318' : '#FFF8F7';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = color;
        document.documentElement.style.setProperty('--tl-boot-bg', color);
        document.documentElement.style.setProperty('--tl-boot-fg', dark ? '#FFF8F7' : '#271719');
        document.documentElement.style.setProperty('--tl-boot-primary', dark ? '#FF8FB5' : '#B90041');
        document.documentElement.style.setProperty('--tl-boot-on-primary', dark ? '#271719' : '#FFFFFF');
        const updateChrome = () => document.querySelectorAll('meta[name="theme-color"]').forEach(tag => { tag.content = color; });
        updateChrome();
        document.addEventListener('DOMContentLoaded', () => { document.body.style.backgroundColor = color; updateChrome(); }, { once: true });
      })();
    </script>
  </head>

  <body>
    <noscript>
      <main style="padding: 24px; font-family: sans-serif; line-height: 1.6">
        <h1>Ative o JavaScript para usar o TrocaLivros</h1>
        <p>Depois, abra o site no celular ou tablet, em uma janela de até 1024 px. Você também poderá adicionar o TrocaLivros à tela inicial pelo menu do navegador.</p>
      </main>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <section id="tl-boot" hidden aria-label="Abertura do TrocaLivros">
      <div class="tl-boot-inner">
        <img src="/brand/boot-mark.svg" width="96" height="96" alt="" aria-hidden="true" />
        <p class="tl-boot-brand">TrocaLivros</p>
        <p id="tl-boot-status" role="status" aria-live="polite">Abrindo o TrocaLivros…</p>
        <button id="tl-boot-reload" type="button" hidden>Recarregar aplicativo</button>
      </div>
    </section>
    <script id="tl-boot-bootstrap">
      (() => {
        if (window.__trocalivrosBoot) return;
        const surface = document.getElementById('tl-boot');
        const root = document.getElementById('root');
        if (!surface || !root) return;
        const image = surface.querySelector('img');
        if (document.documentElement.style.colorScheme === 'dark') image.src = '/brand/boot-mark-dark.svg';
        image.addEventListener('error', () => { image.style.visibility = 'hidden'; }, { once: true });
        surface.hidden = false;
        root.setAttribute('inert', '');
        const reload = document.getElementById('tl-boot-reload');
        reload.addEventListener('click', () => window.location.reload());
        let released = false;
        const timer = setTimeout(() => {
          if (released) return;
          document.getElementById('tl-boot-status').textContent = 'O aplicativo demorou para abrir. Confira sua conexão e tente novamente.';
          reload.hidden = false;
        }, 15000);
        window.__trocalivrosBoot = { release() {
          if (released) return;
          released = true;
          clearTimeout(timer);
          root.removeAttribute('inert');
          const hadFocus = surface.contains(document.activeElement);
          surface.remove();
          if (hadFocus) {
            root.setAttribute('tabindex', '-1');
            root.focus({ preventScroll: true });
          }
        } };
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
